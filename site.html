<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MachadoBank</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#ecfdf5;
  --card:#ffffff;
  --text:#064e3b;
  --green:#10b981;
  --line:#d1fae5;
}

body.dark{
  --bg:#052e16;
  --card:#064e3b;
  --text:#ecfdf5;
  --green:#34d399;
  --line:#065f46;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:20px;
  transition:0.3s;
}

.app{
  max-width:450px;
  margin:auto;
}

.topo{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

.girar{
  display:inline-block;
  animation:girar 2s linear infinite;
}

@keyframes girar{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

.botaoTema{
  border:none;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  background:var(--card);
  color:var(--text);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
}

.saldo{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

.mini{
  background:var(--bg);
  padding:10px;
  border-radius:15px;
}

.pular{
  display:inline-block;
  animation:pular 1.5s infinite;
}

@keyframes pular{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-4px);}
}

input, select, button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
}

button{
  cursor:pointer;
}

.principal{
  background:var(--green);
  color:white;
  border:none;
  font-weight:bold;
}

ul{
  list-style:none;
}

li{
  background:var(--bg);
  padding:10px;
  border-radius:12px;
  margin-top:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.excluir{
  width:auto;
  padding:6px 10px;
  background:red;
  color:white;
  border:none;
}

.barra{
  height:14px;
  background:var(--bg);
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progresso{
  height:100%;
  width:0%;
  background:var(--green);
}

</style>
</head>
<body>

<div class="app">

<div class="topo">
<div class="logo">
<span class="girar">🪓</span> MachadoBank
</div>

<button class="botaoTema" onclick="trocarTema()">🌙/☀️</button>
</div>

<div class="card">
<div>Saldo disponível</div>
<div class="saldo" id="saldo">R$ 0,00</div>

<div class="grid">
<div class="mini">
<span class="pular">⬆️</span><br>
Entradas<br>
<b id="entradas">R$ 0</b>
</div>

<div class="mini">
<span class="pular">⬇️</span><br>
Saídas<br>
<b id="saidas">R$ 0</b>
</div>
</div>
</div>

<div class="card">
<h3>Nova Transação</h3>

<input type="text" id="desc" placeholder="Descrição">
<input type="number" id="valor" placeholder="Valor">

<select id="tipo">
<option value="entrada">Entrada</option>
<option value="saida">Saída</option>
</select>

<select id="categoria">
<option>Alimentação</option>
<option>Transporte</option>
<option>Lazer</option>
<option>Contas</option>
<option>Outros</option>
</select>

<button class="principal" onclick="adicionar()">Adicionar</button>
</div>

<div class="card">
<h3>Meta</h3>

<input type="number" id="meta" placeholder="Digite sua meta">
<button class="principal" onclick="salvarMeta()">Salvar Meta</button>

<div class="barra">
<div class="progresso" id="barra"></div>
</div>
</div>

<div class="card">
<h3>Transações</h3>
<ul id="lista"></ul>
</div>

<div class="card">
<h3>Gastos</h3>
<canvas id="grafico"></canvas>
</div>

</div>

<script>
let transacoes = JSON.parse(localStorage.getItem("transacoes")) || [];
let meta = Number(localStorage.getItem("meta")) || 0;
let chart;

if(localStorage.getItem("tema") === "dark"){
  document.body.classList.add("dark");
}

function trocarTema(){
  document.body.classList.toggle("dark");

  if(document.body.classList.contains("dark")){
    localStorage.setItem("tema","dark");
  }else{
    localStorage.setItem("tema","light");
  }

  atualizar();
}

function salvarDados(){
  localStorage.setItem("transacoes", JSON.stringify(transacoes));
}

function salvarMeta(){
  meta = Number(document.getElementById("meta").value);
  localStorage.setItem("meta", meta);
  atualizar();
}

function adicionar(){
  const desc = document.getElementById("desc").value;
  const valor = Number(document.getElementById("valor").value);
  const tipo = document.getElementById("tipo").value;
  const categoria = document.getElementById("categoria").value;

  if(desc === "" || valor <= 0){
    alert("Preencha os campos corretamente.");
    return;
  }

  transacoes.push({desc, valor, tipo, categoria});
  salvarDados();
  atualizar();

  document.getElementById("desc").value = "";
  document.getElementById("valor").value = "";
}

function remover(index){
  transacoes.splice(index,1);
  salvarDados();
  atualizar();
}

function atualizar(){
  let entradas = 0;
  let saidas = 0;

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  transacoes.forEach((item,index)=>{

    const li = document.createElement("li");

    li.innerHTML = `
      <span>${item.desc} - ${item.categoria} - R$ ${item.valor.toFixed(2)}</span>
      <button class="excluir" onclick="remover(${index})">X</button>
    `;

    lista.appendChild(li);

    if(item.tipo === "entrada"){
      entradas += item.valor;
    }else{
      saidas += item.valor;
    }
  });

  const saldo = entradas - saidas;

  document.getElementById("entradas").innerText = "R$ " + entradas.toFixed(2);
  document.getElementById("saidas").innerText = "R$ " + saidas.toFixed(2);
  document.getElementById("saldo").innerText = "R$ " + saldo.toFixed(2);

  let porcentagem = 0;

  if(meta > 0){
    porcentagem = (saldo / meta) * 100;
    if(porcentagem > 100) porcentagem = 100;
    if(porcentagem < 0) porcentagem = 0;
  }

  document.getElementById("barra").style.width = porcentagem + "%";

  atualizarGrafico();
}

function atualizarGrafico(){
  const categorias = {};

  transacoes.forEach(item=>{
    if(item.tipo === "saida"){
      categorias[item.categoria] = (categorias[item.categoria] || 0) + item.valor;
    }
  });

  const labels = Object.keys(categorias);
  const valores = Object.values(categorias);

  if(chart){
    chart.destroy();
  }

  chart = new Chart(document.getElementById("grafico"), {
    type: "doughnut",
    data:{
      labels: labels,
      datasets:[{
        data: valores
      }]
    },
    options:{
      plugins:{
        legend:{
          labels:{
            color:getComputedStyle(document.body).getPropertyValue('--text')
          }
        }
      }
    }
  });
}

atualizar();
</script>

</body>
</html>
